<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0a0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ColisScan">
    <meta name="description" content="Scanner de codes-barres pour la gestion des colis par distributeur">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="manifest" href="manifest.json">
    <title>Colis Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0a0e14;
            --bg-card: #131920;
            --bg-input: #1c242d;
            --accent: #00d4aa;
            --accent-dark: #00a888;
            --accent-glow: rgba(0, 212, 170, 0.3);
            --danger: #ff4757;
            --danger-dark: #c0392b;
            --danger-glow: rgba(255, 71, 87, 0.25);
            --success: #00d4aa;
            --warning: #ffa502;
            --warning-dark: #e69500;
            --warning-glow: rgba(255, 165, 2, 0.25);
            --text-main: #e8eaed;
            --text-muted: #7f8c9a;
            --border: #1e2832;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            height: 100%; position: fixed; width: 100%;
            display: flex; flex-direction: column; overflow: hidden;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(0,212,170,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0,168,136,0.04) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }

        .app-header {
            background: linear-gradient(180deg, var(--bg-card) 0%, rgba(19,25,32,0.95) 100%);
            padding: 16px 20px; border-bottom: 1px solid var(--border);
            position: relative; z-index: 10; backdrop-filter: blur(10px); flex-shrink: 0;
        }
        #defaultHeader { display: block; }
        #sessionHeader { display: none; }
        .header-title {
            font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 16px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent) 0%, #00ffcc 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .session-header-content { display: flex; justify-content: space-between; align-items: center; }
        .session-name { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .session-count {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: var(--bg-body); padding: 8px 16px; border-radius: 20px;
            font-size: 1.1rem; font-weight: 700; box-shadow: 0 4px 15px var(--accent-glow);
        }
        .nav-tabs { display: flex; background: var(--bg-body); border-radius: 14px; padding: 4px; gap: 4px; }
        .nav-tab {
            flex: 1; padding: 12px; text-align: center; border-radius: 10px;
            font-weight: 600; font-size: 0.85rem; color: var(--text-muted);
            cursor: pointer; transition: all 0.25s; border: none; background: transparent;
        }
        .nav-tab.active {
            background: var(--accent); color: var(--bg-body);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .main-content { flex: 1; overflow: hidden; position: relative; z-index: 1; }
        .views-wrapper {
            display: flex; width: 200%; height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .view-section { width: 50%; height: 100%; overflow-y: auto; padding: 20px; }

        .input-group { display: flex; gap: 12px; margin-bottom: 20px; }
        #defaultHeader .input-group { margin-bottom: 0; }
        .input-field {
            flex: 1; background: var(--bg-card); border: 2px solid var(--border);
            border-radius: 12px; padding: 14px 18px; color: white; font-size: 1rem;
            font-family: inherit; transition: all 0.2s;
        }
        .input-field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }

        .btn {
            padding: 14px 22px; border-radius: 12px; font-weight: 600; font-size: 0.9rem;
            cursor: pointer; border: none; transition: all 0.2s; font-family: inherit;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: var(--bg-body); box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-primary:disabled { background: var(--bg-input); color: var(--text-muted); box-shadow: none; cursor: not-allowed; }
        .btn-success { background: var(--success); color: var(--bg-body); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 2px solid var(--border); }
        .btn-cancel { background: transparent; color: var(--text-muted); border: 2px solid var(--border); }

        .session-controls { display: none; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .session-controls.show { display: grid; }
        .btn-choice { padding: 22px 16px; border-radius: 16px; font-size: 0.95rem; flex-direction: column; gap: 12px; }
        .btn-choice svg { opacity: 0.9; }
        .btn-choice-camera {
            background: linear-gradient(145deg, rgba(0,212,170,0.15) 0%, rgba(0,212,170,0.05) 100%);
            border: 2px solid rgba(0,212,170,0.25); color: var(--accent);
        }
        .btn-choice-camera:active { background: rgba(0,212,170,0.25); border-color: var(--accent); }
        .btn-choice-manual {
            background: linear-gradient(145deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
            border: 2px solid var(--border); color: var(--text-main);
        }
        .btn-choice-manual:active { background: rgba(255,255,255,0.1); }
        .btn-choice-manual.open { border-color: var(--accent); background: rgba(0,212,170,0.08); }

        .camera-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 1500; display: none; flex-direction: column;
            animation: modalUp 0.4s cubic-bezier(0.16,1,0.3,1); backdrop-filter: blur(8px);
        }
        .camera-modal-overlay.show { display: flex; }
        @keyframes modalUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        .camera-modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .camera-modal-title { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .camera-modal-badge {
            background: var(--accent); color: var(--bg-body);
            padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700;
        }
        .camera-close-btn {
            width: 42px; height: 42px; border-radius: 50%; background: var(--bg-input);
            border: 2px solid var(--border); color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .camera-close-btn:active { background: var(--danger); color: white; border-color: var(--danger); }
        .camera-modal-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .scanner-area { flex: 1; background: #000; position: relative; overflow: hidden; min-height: 0; }

        #qr-reader {
            width: 100% !important; height: 100% !important; border: none !important;
            background: transparent !important; position: absolute; top: 0; left: 0;
        }
        #qr-reader > * { border: none !important; }
        #qr-reader__scan_region {
            border: none !important; background: transparent !important;
            min-height: 0 !important; padding: 0 !important;
            width: 100% !important; height: 100% !important;
            position: relative !important; overflow: hidden !important;
        }
        #qr-reader__scan_region img { display: none !important; }
        #qr-reader__dashboard { display: none !important; }
        #qr-reader video {
            width: 100% !important; height: 100% !important; object-fit: cover !important;
            border-radius: 0 !important; border: none !important;
            position: absolute !important; top: 0 !important; left: 0 !important;
        }
        #qr-reader [class*="scan"] img,
        #qr-reader [id*="scan"] img,
        #qr-reader__scan_region > div:not(:first-child) { display: none !important; }

        .scan-flash {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 15; opacity: 0;
        }
        .scan-flash.flash-success {
            background: radial-gradient(ellipse at center, rgba(0,212,170,0.55) 0%, rgba(0,212,170,0.15) 40%, transparent 75%);
            animation: ff 0.55s ease-out forwards;
        }
        .scan-flash.flash-duplicate {
            background: radial-gradient(ellipse at center, rgba(255,71,87,0.55) 0%, rgba(255,71,87,0.15) 40%, transparent 75%);
            animation: ff 0.55s ease-out forwards;
        }
        .scan-flash.flash-moved {
            background: radial-gradient(ellipse at center, rgba(255,165,2,0.55) 0%, rgba(255,165,2,0.15) 40%, transparent 75%);
            animation: ff 0.55s ease-out forwards;
        }
        @keyframes ff { 0% { opacity: 1; } 100% { opacity: 0; } }

        .flash-btn {
            position: absolute; bottom: 16px; right: 16px; width: 52px; height: 52px;
            border-radius: 50%; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.15);
            color: white; cursor: pointer; display: none; align-items: center; justify-content: center;
            z-index: 20; transition: all 0.3s; backdrop-filter: blur(8px);
        }
        .flash-btn.show { display: flex; }
        .flash-btn.active {
            background: var(--warning); color: var(--bg-body);
            border-color: var(--warning); box-shadow: 0 0 20px var(--warning-glow);
        }
        .camera-modal-footer {
            padding: 16px 20px; background: var(--bg-card); border-top: 1px solid var(--border);
            display: flex; gap: 12px; flex-shrink: 0;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }
        .camera-modal-footer .btn { flex: 1; }

        .scan-frame-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 75%; aspect-ratio: 4/3; z-index: 10; pointer-events: none;
        }
        .scan-frame-overlay::before, .scan-frame-overlay::after,
        .sfc-bl::before, .sfc-br::before {
            content: ''; position: absolute; width: 28px; height: 28px;
            border-color: var(--accent); border-style: solid; border-width: 0;
        }
        .scan-frame-overlay::before { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 8px; }
        .scan-frame-overlay::after { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 8px; }
        .sfc-bl::before { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 8px; }
        .sfc-br::before { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 8px; }
        .sfc-bl, .sfc-br { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .scan-line {
            position: absolute; top: 0; left: 8%; right: 8%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            box-shadow: 0 0 12px var(--accent-glow);
            animation: slm 2.5s ease-in-out infinite; z-index: 11; pointer-events: none;
        }
        @keyframes slm { 0%, 100% { top: 5%; } 50% { top: 92%; } }

        .manual-entry {
            background: var(--bg-card); padding: 16px; border-radius: 16px;
            margin-bottom: 20px; display: none; border: 1px solid var(--border); animation: sd 0.3s ease;
        }
        .manual-entry.show { display: block; }
        @keyframes sd { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .manual-textarea {
            width: 100%; background: var(--bg-body); border: 2px solid var(--border);
            border-radius: 12px; padding: 14px; color: white; font-size: 1rem;
            resize: vertical; min-height: 90px; font-family: 'Consolas','Monaco',monospace;
        }
        .manual-textarea:focus { outline: none; border-color: var(--accent); }

        .section-header { display: flex; align-items: center; gap: 12px; margin: 8px 0 16px; }
        .section-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border) 0%, transparent 100%); }
        .section-line:last-child { background: linear-gradient(90deg, transparent 0%, var(--border) 100%); }
        .section-title {
            font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1.5px; white-space: nowrap;
        }
        .section-count {
            font-size: 0.75rem; font-weight: 700; color: var(--accent);
            background: rgba(0,212,170,0.1); padding: 2px 10px; border-radius: 20px; margin-left: 4px;
        }

        .list-card {
            background: var(--bg-card); border-radius: 16px; margin-bottom: 14px;
            overflow: hidden; border: 1px solid var(--border); transition: all 0.3s;
        }
        .list-header {
            padding: 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .list-info h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 5px; }
        .list-info p { font-size: 0.82rem; color: var(--text-muted); }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .list-badge {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: var(--bg-body); padding: 5px 12px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 700; min-width: 36px; text-align: center;
        }
        .list-badge.archive { background: var(--bg-input); color: var(--text-muted); }
        .expand-icon { margin-left: 4px; transition: transform 0.3s; color: var(--text-muted); }
        .list-card.open > .list-header .expand-icon { transform: rotate(180deg); }
        .list-content { display: none; border-top: 1px solid var(--border); background: rgba(0,0,0,0.15); }
        .list-card.open > .list-content { display: block; }
        .code-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; border-bottom: 1px solid var(--border);
        }
        .code-row:last-child { border-bottom: none; }
        .code-text {
            font-family: 'Consolas','Monaco',monospace; font-size: 0.92rem;
            color: var(--text-main); word-break: break-all;
        }
        .code-actions { display: flex; gap: 8px; flex-shrink: 0; }

        .icon-btn-lg {
            width: 46px; height: 46px; border-radius: 14px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; background: transparent; flex-shrink: 0;
        }
        .icon-btn-sm {
            width: 36px; height: 36px; border-radius: 10px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; background: transparent;
        }
        .btn-resume {
            background: rgba(0,212,170,0.15); color: var(--accent);
            box-shadow: inset 0 0 0 2px rgba(0,212,170,0.3);
        }
        .btn-resume:active { background: var(--accent); color: var(--bg-body); box-shadow: 0 0 16px var(--accent-glow); }
        .btn-excel { background: rgba(255,255,255,0.05); color: var(--text-muted); }
        .btn-excel:active { background: rgba(255,255,255,0.12); color: var(--text-main); }
        .btn-archive { background: rgba(255,71,87,0.1); color: var(--danger); }
        .btn-archive:active { background: var(--danger); color: white; }
        .btn-copy { background: rgba(0,212,170,0.08); color: var(--accent); }
        .btn-copy:active { background: var(--accent); color: var(--bg-body); }
        .btn-del { background: rgba(255,71,87,0.08); color: var(--danger); }
        .btn-del:active { background: var(--danger); color: white; }

        .date-group-header {
            background: linear-gradient(90deg, rgba(0,212,170,0.1) 0%, rgba(0,212,170,0.02) 100%);
            border-left: 4px solid var(--accent);
        }
        .date-group-content { padding: 12px; background: rgba(0,0,0,0.1); }
        .date-group-content .list-card { background: var(--bg-body); margin-bottom: 10px; }
        .search-highlight { border: 2px solid var(--success) !important; background: rgba(0,212,170,0.08); }

        .archive-toolbar {
            display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
            background: var(--bg-card); border-radius: 14px; padding: 10px 14px; border: 1px solid var(--border);
        }
        .archive-toolbar .toolbar-search {
            flex: 1; background: var(--bg-body); border: 2px solid var(--border);
            border-radius: 10px; padding: 10px 14px; color: white; font-size: 0.9rem; font-family: inherit;
        }
        .archive-toolbar .toolbar-search:focus { outline: none; border-color: var(--accent); }
        .toolbar-icon-btn {
            width: 44px; height: 44px; border-radius: 12px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
            background: rgba(255,255,255,0.05); color: var(--text-muted); position: relative;
        }
        .toolbar-icon-btn:active { background: rgba(255,255,255,0.12); color: var(--text-main); }
        .toolbar-icon-btn.t-excel:active { color: #1d9e6f; background: rgba(29,158,111,0.12); }
        .toolbar-icon-btn.t-json:active { color: var(--warning); background: rgba(255,165,2,0.12); }
        .json-dropdown {
            position: absolute; top: calc(100% + 6px); right: 0;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 6px; min-width: 180px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5); z-index: 100;
            display: none; animation: di 0.2s ease;
        }
        .json-dropdown.show { display: block; }
        @keyframes di { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .json-dropdown-item {
            display: flex; align-items: center; gap: 10px; padding: 12px 14px;
            border-radius: 8px; border: none; background: transparent;
            color: var(--text-main); font-family: inherit; font-size: 0.88rem;
            font-weight: 500; cursor: pointer; width: 100%;
        }
        .json-dropdown-item:active { background: rgba(255,255,255,0.06); }
        .json-dropdown-item svg { flex-shrink: 0; }
        .json-dropdown-item.dd-export svg { color: var(--accent); }
        .json-dropdown-item.dd-import svg { color: var(--warning); }

        .storage-bar {
            background: var(--bg-card); border-radius: 12px; padding: 12px 16px;
            margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
            border: 1px solid var(--border); font-size: 0.85rem;
        }
        .storage-bar .icon { color: var(--success); }
        .storage-bar .info { flex: 1; color: var(--text-muted); }
        .storage-bar .count { color: var(--text-main); font-weight: 600; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; align-items: center;
            justify-content: center; z-index: 2000; backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--bg-card); padding: 28px; border-radius: 20px;
            width: 90%; max-width: 380px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid var(--border);
        }
        .modal-box h3 { margin-bottom: 12px; font-size: 1.1rem; }
        .modal-box h3.danger { color: var(--danger); }
        .modal-box h3.warning { color: var(--warning); }
        .modal-box p { margin-bottom: 24px; color: var(--text-muted); line-height: 1.6; font-size: 0.9rem; white-space: pre-line; }
        .modal-actions { display: flex; gap: 12px; }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: rgba(19,25,32,0.97); color: white; border-radius: 16px;
            box-shadow: 0 12px 44px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
            z-index: 3000; opacity: 0;
            transition: all 0.45s cubic-bezier(0.16,1,0.3,1);
            max-width: 92%; overflow: hidden; display: flex;
            min-width: 240px; backdrop-filter: blur(20px);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-accent { width: 4px; flex-shrink: 0; }
        .toast.success .toast-accent { background: linear-gradient(180deg, var(--success), #00a888); }
        .toast.error .toast-accent { background: linear-gradient(180deg, var(--danger), var(--danger-dark)); }
        .toast.warning .toast-accent { background: linear-gradient(180deg, var(--warning), var(--warning-dark)); }
        .toast-body { padding: 14px 16px; flex: 1; min-width: 0; }
        .toast-title { font-weight: 600; font-size: 0.88rem; margin-bottom: 3px; display: flex; align-items: center; gap: 8px; line-height: 1.3; }
        .toast.success .toast-title { color: var(--success); }
        .toast.error .toast-title { color: var(--danger); }
        .toast.warning .toast-title { color: var(--warning); }
        .toast-sub {
            font-size: 0.76rem; color: var(--text-muted); white-space: pre-line;
            word-break: break-all; font-family: 'Consolas','Monaco',monospace;
            line-height: 1.45; padding-left: 26px; max-height: 60px; overflow: hidden;
        }
        .toast-icon { flex-shrink: 0; display: flex; align-items: center; }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }

        #jsonFileInput { display: none; }

        /* Login / lock screen */
        #appRoot { display: none; flex-direction: column; flex: 1; min-height: 0; width: 100%; }

            padding: 20px;

        .login-box {
            width: 100%; max-width: 340px; text-align: center;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 22px; padding: 32px 26px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);

            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .login-icon {
            width: 60px; height: 60px; border-radius: 18px; margin: 0 auto 18px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: var(--bg-body); box-shadow: 0 8px 24px var(--accent-glow);

        .login-title {
            font-size: 1.2rem; font-weight: 700; margin-bottom: 6px;
            background: linear-gradient(135deg, var(--accent) 0%, #00ffcc 100%);

        }
        .login-sub { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }
        .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 10px; }
        .pin-dot {
            width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border);
            background: transparent; transition: all 0.2s;

        .pin-dot.filled { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

            cursor: pointer; z-index: 20;
        }
        .lock-btn:active { background: rgba(255,255,255,0.12); color: var(--text-main); }

        .conn-status {
            position: absolute; top: 20px; left: 20px; width: 11px; height: 11px; border-radius: 50%;

            transition: background 0.3s ease, box-shadow 0.3s ease; z-index: 20; cursor: pointer;

        .conn-status.online { background: var(--success); box-shadow: 0 0 8px rgba(0,212,170,0.6); animation: connPulse 2.4s infinite; }
        .conn-status.pending { background: var(--warning); box-shadow: 0 0 8px rgba(255,165,2,0.7); animation: connPulseWarn 1.2s infinite; }
        @keyframes connPulse {

            50% { box-shadow: 0 0 12px rgba(255,165,2,0.95); }
        }

        body.client-mode #downloadAllExcelBtn,

    <script>
    var DB = 'ColisScannerDB';
    var VER = 1;
    var SD = 'distributors';
    var SA = 'archive';
    var db = null;

    function openDB() {
        return new Promise(function(ok, no) {
            var r = indexedDB.open(DB, VER);
            r.onerror = function() { no(r.error); };
            r.onsuccess = function() { db = r.result; ok(db); };
            r.onupgradeneeded = function(e) {
                var d = e.target.result;
                if (!d.objectStoreNames.contains(SD)) d.createObjectStore(SD, { keyPath: 'id' });
                if (!d.objectStoreNames.contains(SA)) d.createObjectStore(SA, { keyPath: 'id' });
            };
        });
    }

    function dbAll(store) {
        return new Promise(function(ok, no) {
            var q = db.transaction([store], 'readonly').objectStore(store).getAll();
            q.onsuccess = function() { ok(q.result); };
            q.onerror = function() { no(q.error); };
        });
    }

    // ==== طابور المزامنة: يحفظ التعديلات محليا ويرفعها الى Firebase عند توفر الاتصال ====
    var SYNC_KEY = 'csSyncQueue';

    function loadSyncQueue() {
        try { return JSON.parse(localStorage.getItem(SYNC_KEY) || '[]'); } catch(e) { return []; }
    }
    function saveSyncQueue(q) {
        try { localStorage.setItem(SYNC_KEY, JSON.stringify(q)); } catch(e) {}
    }
    function queueSync(store, op, id, data) {
        var q = loadSyncQueue();
        q = q.filter(function(item) { return !(item.store === store && item.id === id); });
        q.push({ store: store, op: op, id: id, data: data || null, ts: Date.now() });
        saveSyncQueue(q);
        if (typeof updateConnBadge === 'function') updateConnBadge();
    }
    var syncing = false;
    var flushRequested = false;
    var syncFailStreak = 0;
    var syncWarned = false;
    function updateConnBadge() {
        var dot = document.getElementById('connStatusDot');
        if (!dot) return;
        var pending = loadSyncQueue().length;
        dot.classList.toggle('pending', pending > 0);
        if (pending > 0) { dot.title = pending + ' element(s) en attente de synchronisation'; }
        else if (dot.classList.contains('online')) { dot.title = 'Connecte'; }
        else { dot.title = 'Hors ligne (mode local)'; }
    }
    function withTimeout(promise, ms) {
        return Promise.race([
            promise,
            new Promise(function(_, reject) { setTimeout(function() { reject(new Error('timeout: pas de reponse du serveur')); }, ms); })
        ]);
    }
    async function flushSyncQueue() {
        if (!window.fbDB) return;
        if (syncing) { flushRequested = true; return; }
        syncing = true;
        var lastError = null;
        try {
            do {
                flushRequested = false;
                var q = loadSyncQueue();
                if (!q.length) { syncFailStreak = 0; syncWarned = false; break; }
                var remaining = [];
                for (var i = 0; i < q.length; i++) {
                    var item = q[i];
                    try {
                        if (item.op === 'delete') { await withTimeout(window.fbRemove(window.fbRef(window.fbDB, item.store + '/' + item.id)), 8000); }
                        else { await withTimeout(window.fbSet(window.fbRef(window.fbDB, item.store + '/' + item.id), item.data), 8000); }
                    } catch(e) {
                        lastError = (e && (e.code || e.message)) || String(e);
                        console.error('Sync error for', item.store + '/' + item.id, e);
                        remaining.push(item);
                    }
                }
                saveSyncQueue(remaining);
                if (remaining.length > 0) { syncFailStreak++; } else { syncFailStreak = 0; syncWarned = false; }
            } while (flushRequested);
        } finally {
            syncing = false;
            updateConnBadge();
            if (syncFailStreak >= 1 && !syncWarned && typeof toast === 'function') {
                syncWarned = true;
                toast('Erreur de synchronisation', 'error', lastError ? String(lastError) : 'Donnees en attente non envoyees.');
            }
        }
    }
    window.flushSyncQueue = flushSyncQueue;
    window.addEventListener('online', function() { flushSyncQueue(); });
    setInterval(function() { if (window.fbDB) flushSyncQueue(); }, 20000);

    function dbPut(store, data) {
        return new Promise(function(ok, no) {
            var q = db.transaction([store], 'readwrite').objectStore(store).put(data);
            q.onsuccess = function() { 
                // حفظ التعديل في طابور المزامنة، ثم محاولة الرفع الى Firebase فورا اذا كان هناك اتصال
                if (data && data.id) { queueSync(store, 'put', data.id, data); flushSyncQueue(); }
                ok(); 
            };
            q.onerror = function() { no(q.error); };
        });
    }

    function dbDel(store, id) {
        return new Promise(function(ok, no) {
            var q = db.transaction([store], 'readwrite').objectStore(store).delete(id);
            q.onsuccess = function() { 
                if (id) { queueSync(store, 'delete', id, null); flushSyncQueue(); }
                ok(); 
            };
            q.onerror = function() { no(q.error); };
        });
    }

    function dbClearPut(store, items) {
        return new Promise(function(ok, no) {
            var tx = db.transaction([store], 'readwrite');
            var st = tx.objectStore(store);
            var cr = st.clear();
            cr.onsuccess = function() {
                if (!items.length) { ok(); return; }
                var n = 0;
                items.forEach(function(i) {
                    var q = st.add(i);
                    q.onsuccess = function() { if (++n === items.length) ok(); };
                    q.onerror = function() { no(q.error); };
                });
            };
            cr.onerror = function() { no(cr.error); };
        });
    }

    function dbPutAll(store, items) {
        return new Promise(function(ok, no) {
            if (!items.length) { ok(); return; }
            var tx = db.transaction([store], 'readwrite');
            var st = tx.objectStore(store);
            var n = 0;
            items.forEach(function(i) {
                var q = st.put(i);
                q.onsuccess = function() { 
                    if (i.id) { queueSync(store, 'put', i.id, i); }
                    if (++n === items.length) { flushSyncQueue(); ok(); }
                };
                q.onerror = function() { no(q.error); };
            });
        });
    }

    async function migrate() {
        try {
            var d = localStorage.getItem('distData');
            var a = localStorage.getItem('distArchive');
            if (d) { var p = JSON.parse(d); if (p.length) await dbPutAll(SD, p); localStorage.removeItem('distData'); }
            if (a) { var p2 = JSON.parse(a); if (p2.length) { p2.forEach(function(x) { x.archived = true; }); await dbPutAll(SD, p2); } localStorage.removeItem('distArchive'); }
        } catch(e) {}
        // دمج بيانات النظام القديم للأرشيف (لي كان مخزن محليا فقط وما كيتزامنش) مع الموزعين، ثم افراغه نهائيا
        try {

                row.addEventListener('click', async function(e) {
                    var b = e.target.closest('[data-act]'); if (!b) return;
                    if (b.dataset.act === 'copy') { try { await navigator.clipboard.writeText(code); } catch(e) {} toast('Code copie', 'success'); return; }
                    if (b.dataset.act === 'del') {
                        if (!await showConfirm('Supprimer ce code ?', 'Supprimer', 'danger', 'Oui', 'btn-danger')) return;

                });

            })(codes[idx], idx);

    function renderArchive() {
        $('archiveCount').textContent = archivedList().length;
        updateArchiveFab();
        buildArchiveGroupsInto('archiveListContainer', true);
        if ($('drawerArchiveList')) buildArchiveGroupsInto('drawerArchiveList', false);
    }

    function buildArchiveGroupsInto(containerId, checkMainSearch) {
        var c = $(containerId); if (!c) return; c.innerHTML = '';
        var groups = {};
        var sorted = archivedList().sort(function(a, b) { return new Date(b.deletedAt || b.date) - new Date(a.deletedAt || a.date); });
        for (var i = 0; i < sorted.length; i++) {
            var item = sorted[i]; var key = fmtD(item.deletedAt || item.date);
            if (!groups[key]) groups[key] = []; groups[key].push(item);
        }
        var keys = Object.keys(groups);
        if (!keys.length) {
            var mainSearchActive = checkMainSearch && $('archiveSearchResult') && $('archiveSearchResult').innerHTML;
            if (!mainSearchActive) {
                c.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9v6M14 9v6"/></svg><h3>Aucune archive</h3><p>Les archives apparaitront ici</p></div>';
            }
            return;
        }
        for (var k = 0; k < keys.length; k++) {
            var dk = keys[k]; var items = groups[dk]; var total = 0;
            for (var j = 0; j < items.length; j++) total += items[j].codes.length;
            var card = document.createElement('div'); card.className = 'list-card';
            var hdr = document.createElement('div'); hdr.className = 'list-header date-group-header';
            hdr.innerHTML = '<div class="list-info"><h3>' + dk + '</h3><p>' + items.length + ' distributeur(s) - ' + total + ' colis</p></div><div class="header-actions"><button class="icon-btn-lg btn-archive" data-act="del-date" data-date="' + dk + '" title="Supprimer ce groupe">' + SVG.trash + '</button>' + SVG.chevron + '</div>';
            (function(dk2, cardEl) {
                hdr.addEventListener('click', async function(e) {
                    var b = e.target.closest('[data-act="del-date"]');
                    if (b) {
                        e.stopPropagation();
                        if (await showConfirm('Supprimer toutes les archives du ' + b.dataset.date + ' ?', 'Supprimer groupe', 'danger', 'Oui', 'btn-danger')) {
                            var toRemove = archivedList().filter(function(x) { return fmtD(x.deletedAt || x.date) === b.dataset.date; });
                            var removeIds = {}; toRemove.forEach(function(x) { removeIds[x.id] = true; });
                            S.dist = S.dist.filter(function(x) { return !removeIds[x.id]; });
                            for (var ri = 0; ri < toRemove.length; ri++) { await dbDel(SD, toRemove[ri].id); }
                            toast('Groupe supprime', 'success'); renderArchive();
                        }
                        return;
                    }
                    cardEl.classList.toggle('open');
                });
            })(dk, card);
            var cnt = document.createElement('div'); cnt.className = 'list-content date-group-content';
            for (var m = 0; m < items.length; m++) cnt.appendChild(mkCard(items[m], 'archive'));
            card.appendChild(hdr); card.appendChild(cnt); c.appendChild(card);
        }
    }

    function mkCard(item, type) {
        var card = document.createElement('div'); card.className = 'list-card'; card.dataset.id = item.id;
        var hdr = document.createElement('div'); hdr.className = 'list-header';
        var actionsHtml = '';
        if (type === 'dist') {
            actionsHtml = '<button class="icon-btn-lg btn-resume" data-act="resume" data-id="' + item.id + '" title="Reprendre">' + SVG.play + '</button><button class="icon-btn-lg btn-excel" data-act="excel" data-id="' + item.id + '" title="Excel">' + SVG.excel + '</button><button class="icon-btn-lg btn-archive" data-act="archive" data-id="' + item.id + '" title="Archiver">' + SVG.trash + '</button>';
        } else {
            actionsHtml = '<button class="icon-btn-lg btn-excel" data-act="excel" data-id="' + item.id + '" title="Excel">' + SVG.excel + '</button><button class="icon-btn-lg btn-archive" data-act="del-arch" data-id="' + item.id + '" title="Supprimer">' + SVG.trash + '</button>';
        }
        var badgeClass = type === 'archive' ? 'list-badge archive' : 'list-badge';
        hdr.innerHTML = '<div class="list-info"><h3>' + item.name + '</h3><p>' + item.codes.length + ' codes - ' + fmtD(item.date || item.deletedAt) + '</p></div><div class="header-actions">' + actionsHtml + '<span class="' + badgeClass + '">' + item.codes.length + '</span>' + SVG.chevron + '</div>';
        hdr.addEventListener('click', function(e) {
            var b = e.target.closest('[data-act]');
            if (b) { e.stopPropagation(); doCardAct(b.dataset.act, b.dataset.id, b.dataset.date); return; }
            card.classList.toggle('open');
        });
        var cnt = document.createElement('div'); cnt.className = 'list-content';
        for (var idx = 0; idx < item.codes.length; idx++) {
            (function(code, i) {
                var row = document.createElement('div'); row.className = 'code-row';
                var delHtml = ''; if (type === 'dist') delHtml = '<button class="icon-btn-sm btn-del" data-act="del-code" data-idx="' + i + '">' + SVG.delSmall + '</button>';
                row.innerHTML = '<span class="code-text">' + code + '</span><div class="code-actions"><button class="icon-btn-sm btn-copy" data-act="copy">' + SVG.copy + '</button>' + delHtml + '</div>';
                row.addEventListener('click', async function(e) {
                    var b = e.target.closest('[data-act]'); if (!b) return; e.stopPropagation();
                    if (b.dataset.act === 'copy') { try { await navigator.clipboard.writeText(code); } catch(e) {} toast('Code copie', 'success'); }
                    else if (b.dataset.act === 'del-code') { await delCode(item.id, parseInt(b.dataset.idx)); }
                });
                cnt.appendChild(row);
            })(item.codes[idx], idx);
        }
        card.appendChild(hdr); card.appendChild(cnt); return card;
    }

    async function doCardAct(act, id, extra) {
        if (act === 'resume') { await doResumeSession(id); }
        else if (act === 'excel') { await doExcel(id); }
        else if (act === 'archive') { await doArchive(id); }
        else if (act === 'del-arch') {
            if (await showConfirm('Supprimer cette archive definitivement ?', 'Supprimer', 'danger', 'Oui', 'btn-danger')) {
                S.dist = S.dist.filter(function(x) { return x.id !== id; }); await dbDel(SD, id);
                toast('Archive supprimee', 'success'); renderArchive();
            }
        }
    }

    async function delCode(id, idx) {
        if (!await showConfirm('Supprimer ce code ?', 'Supprimer', 'danger', 'Oui', 'btn-danger')) return;
        var item = S.dist.find(function(d) { return d.id === id; }); if (!item) return;
        item.codes.splice(idx, 1);
        if (!item.codes.length) { S.dist = S.dist.filter(function(d) { return d.id !== id; }); await dbDel(SD, id); toast('Distributeur supprime', 'warning'); }
        else { await dbPut(SD, item); toast('Code supprime', 'warning'); }
        renderDist();
    }

    async function doArchive(id, silent) {
        var d = S.dist.find(function(x) { return x.id === id; }); if (!d) return;
        d.archived = true;
        d.deletedAt = new Date().toISOString();
        try {
            await dbPut(SD, d);
        } catch(e) { console.error('doArchive error', e); toast('Erreur archivage', 'error', String((e && e.message) || e)); }
        if (!silent) { toast('Archive', 'success'); }
        renderDist(); renderArchive();
    }

    async function doExcel(id) {
        var item = S.dist.find(function(d) { return d.id === id; });
        if (!item) return;
        var wasActive = !item.archived;
        var sp = [], nm = [];
        for (var i = 0; i < item.codes.length; i++) {
            var c = item.codes[i];
            if (c.indexOf('DH') === 0 || c.indexOf('DXH') === 0 || c.indexOf('DSH') === 0) sp.push(c); else nm.push(c);
        }
        var data = [];
        for (var j = 0; j < sp.length; j++) data.push([sp[j]]);
        if (sp.length && nm.length) data.push([]);
        for (var k = 0; k < nm.length; k++) data.push([nm[k]]);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), 'Codes');
        XLSX.writeFile(wb, item.name + '.xlsx');
        if (wasActive) {
            // ارشفة تلقائية فور تحميل ملف Excel لموزع نشط
            await doArchive(id, true);
            toast('Fichier telecharge et archive', 'success', item.name);
        } else {
            toast('Fichier telecharge', 'success');
        }
    }

    async function doResumeSession(id) {
        var d = S.dist.find(function(x) { return x.id === id; });
        if (!d) return;

        if (S.session.active) {
            if (S.session.codes.length > 0) {
                if (!await showConfirm(
                    'Session "' + S.session.name + '" en cours (' + S.session.codes.length + ' codes).\nSauvegarder avant de reprendre "' + d.name + '" ?',
                    'Session en cours', 'warning', 'Sauvegarder', 'btn-primary'
                )) return;
                await doSave();
            }
            await stopCam();
        }

        S.session = {
            active: true,
            name: d.name,
            codes: d.codes.slice(),
            id: d.id,
            resume: true
        };
        $('distName').value = d.name;
        enterSession();
    }

    async function doSave() {
        var s = S.session; if (!s.active) return;
        if (s.resume && s.id) {
            var existing = S.dist.find(function(d) { return d.id === s.id; });
            if (existing) { existing.codes = s.codes.slice(); existing.date = new Date().toISOString(); await dbPut(SD, existing); }
        } else if (s.codes && s.codes.length > 0) {
            var newItem = { id: Date.now().toString(), name: s.name, codes: s.codes.slice(), date: new Date().toISOString(), archived: false };
            S.dist.push(newItem); await dbPut(SD, newItem);
        }
    }

            if (!Array.isArray(data)) { toast('Format invalide', 'error'); return; }
            var valid = data.filter(function(i) { return i && typeof i.id === 'string' && typeof i.name === 'string' && Array.isArray(i.codes); });
            valid.forEach(function(i) { i.archived = true; if (!i.deletedAt) i.deletedAt = i.date || new Date().toISOString(); });
            if (!valid.length) { toast('Aucune donnee valide', 'error'); return; }
            if (valid.length < data.length) toast((data.length - valid.length) + ' invalide(s) ignore(s)', 'warning');
            if (await showConfirm(valid.length + ' archive(s) valide(s).\nRemplacer tout ?\n(Non = fusionner)', 'Importer', 'warning', 'Oui, remplacer', 'btn-danger')) {
                var newIds = {}; valid.forEach(function(v) { newIds[v.id] = true; });
                var removedOld = archivedList().filter(function(x) { return !newIds[x.id]; });
                for (var oi = 0; oi < removedOld.length; oi++) { await dbDel(SD, removedOld[oi].id); }
                var removeSet = {}; removedOld.forEach(function(x) { removeSet[x.id] = true; });
                S.dist = S.dist.filter(function(x) { return !removeSet[x.id]; });
                valid.forEach(function(v) {
                    var idx = S.dist.findIndex(function(x) { return x.id === v.id; });
                    if (idx !== -1) S.dist[idx] = v; else S.dist.push(v);
                });
                await dbPutAll(SD, valid);
                toast(valid.length + ' importee(s)', 'success');
            } else {
                var existingIds = {}; S.dist.forEach(function(x) { existingIds[x.id] = true; });
                var toAdd = [];
                for (var j = 0; j < valid.length; j++) { if (!existingIds[valid[j].id]) { S.dist.push(valid[j]); existingIds[valid[j].id] = true; toAdd.push(valid[j]); } }
                if (toAdd.length) { await dbPutAll(SD, toAdd); }
                toast(toAdd.length ? toAdd.length + ' nouvelle(s)' : 'Toutes existent deja', toAdd.length ? 'success' : 'warning');

    async function startCam() {
        if (S.camOpen) return;

            S.scanner = new Html5Qrcode('qr-reader');
            await S.scanner.start(
                { facingMode: 'environment' },
                { fps: 30, qrbox: function(w, h) { return { width: Math.min(w * 0.85, 360), height: Math.min(w * 0.6, 260) }; }, aspectRatio: 1.0, useBarCodeDetectorIfSupported: true },
                onScan, function() {}

            $('pauseBtn').className = 'btn btn-secondary';

    async function onScan(rawCode) {
        if (S.busy) return;
        var code = extractCode(rawCode); S.busy = true;
        try {
            if (S.session.codes.indexOf(code) !== -1) {
                sDup(); tFlash('duplicate'); if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
                toast('Code duplique', 'error', code); return;
            }
            var other = activeList().find(function(d) { return d.id !== S.session.id && d.codes.indexOf(code) !== -1; });
            if (other) {
                other.codes = other.codes.filter(function(c) { return c !== code; });
                if (!other.codes.length) { S.dist = S.dist.filter(function(d) { return d.id !== other.id; }); await dbDel(SD, other.id); }
                else { await dbPut(SD, other); }
                S.session.codes.push(code); syncCnt(); renderSessionCodes(); tFlash('moved'); sMov();
                if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
                toast('Code deplace', 'warning', '"' + other.name + '" → "' + S.session.name + '"\n' + code); return;
            }
            S.session.codes.push(code); syncCnt(); renderSessionCodes(); tFlash('success'); sOk();
            if (navigator.vibrate) navigator.vibrate(80);
            toast('Code ajoute', 'success', code);
        } finally { S.busy = false; }
    }

            $('pauseBtn').className = 'btn btn-secondary';
        }
    });

    $('addManualBtn').addEventListener('click', async function() {
        var raw = $('manualInput').value.trim(); if (!raw) return;
        var codes = raw.split('\n').map(function(c) { return c.trim(); }).filter(function(c) { return c.length > 0; });
        if (!codes.length) return;
        var added = 0, dups = 0, moved = 0, movedList = [];
        for (var i = 0; i < codes.length; i++) {
            var code = extractCode(codes[i]);
            if (S.session.codes.indexOf(code) !== -1) { dups++; continue; }
            var other = activeList().find(function(d) { return d.id !== S.session.id && d.codes.indexOf(code) !== -1; });
            if (other) {
                other.codes = other.codes.filter(function(c) { return c !== code; });
                if (!other.codes.length) { S.dist = S.dist.filter(function(d) { return d.id !== other.id; }); await dbDel(SD, other.id); }
                else { await dbPut(SD, other); }
                moved++; movedList.push(code + ': "' + other.name + '"'); S.session.codes.push(code); added++;
            } else { S.session.codes.push(code); added++; }
        }
        syncCnt();
        if (added) { $('manualInput').value = ''; sOk(); renderSessionCodes(); }
        if (moved && added - moved) { tFlash('moved'); sMov(); toast(moved + ' deplace(s), ' + (added - moved) + ' ajoute(s)', 'warning', movedList.slice(0, 4).join('\n') + (movedList.length > 4 ? '\n...' : '')); }
        else if (moved) { tFlash('moved'); sMov(); toast(moved + ' deplace(s)', 'warning', movedList.slice(0, 5).join('\n')); }
        else if (added) { tFlash('success'); toast(added + ' ajoute(s)', 'success'); }
        if (dups) { (function(d) { setTimeout(function() { toast(d + ' en double ignore(s)', 'error'); }, moved ? 800 : 0); })(dups); }
    });

    });

    window.addEventListener('beforeunload', function(e) {
        if (S.session.active && S.session.codes.length > 0) {
            e.preventDefault(); e.returnValue = '';
        }
    });

    var LOGIN_CODES = { '0000': 'client', '8903': 'admin' };
    var pin = '';

    function updatePinDots() {
        var dots = document.querySelectorAll('#pinDots .pin-dot');
        for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('filled', i < pin.length);
    }

    function applyRole() {
        if (S.role === 'client') {
            document.body.classList.add('client-mode');
            S.tab = 1; goTabForce(1);
        } else {
            document.body.classList.remove('client-mode');
            S.tab = 0; goTabForce(0);
        }
    }

    function goTabForce(i) {
        S.tab = i;
        var tabs = document.querySelectorAll('.nav-tab');
        tabs.forEach(function(t) { t.classList.remove('active'); });
        if (tabs[i]) tabs[i].classList.add('active');
        $('viewsWrapper').style.transform = 'translateX(-' + (i * 50) + '%)';
        if (i === 1) { renderArchive(); }
    }

    function tryUnlock() {
        var role = LOGIN_CODES[pin];
        if (role) {
            S.role = role; applyRole();
            try { localStorage.setItem('csRole', role); } catch(e) {}
            $('loginScreen').classList.add('hidden');
            $('appRoot').style.display = 'flex';
            document.body.classList.remove('locked');
            pin = ''; updatePinDots(); $('pinError').textContent = '';
        } else {
            $('pinError').textContent = 'Code incorrect';
            var box = $('loginBox'); box.classList.add('shake');
            setTimeout(function() { box.classList.remove('shake'); pin = ''; updatePinDots(); }, 400);
        }
    }

    document.querySelectorAll('#pinKeypad [data-k]').forEach(function(b) {
        b.addEventListener('click', function() {
            if (pin.length >= 4) return;
            pin += b.dataset.k; updatePinDots(); $('pinError').textContent = '';
            if (pin.length === 4) setTimeout(tryUnlock, 150);
        });
    });
    $('pinBackspace').addEventListener('click', function() {
        pin = pin.slice(0, -1); updatePinDots(); $('pinError').textContent = '';
    });

    $('connStatusDot').addEventListener('click', function() {
        var pending = loadSyncQueue().length;
        toast(pending > 0 ? (pending + ' element(s) en attente') : 'Tout est synchronise', pending > 0 ? 'warning' : 'success');
        syncWarned = false; syncFailStreak = 0;
        flushSyncQueue();
    });

    $('lockBtn').addEventListener('click', async function() {
        if (S.session.active && S.session.codes.length > 0) {
            var save = await showConfirm(
                'La session "' + S.session.name + '" (' + S.session.codes.length + ' code(s)) n\'est pas sauvegardee.\nVoulez-vous la sauvegarder avant de verrouiller ?',
                'Session non sauvegardee', 'warning', 'Sauvegarder', 'btn-primary'
            );
            if (save) { await doSave(); toast('Session sauvegardee', 'success'); }
            await stopCam(); resetHome();
        }
        S.role = null; document.body.classList.remove('client-mode'); document.body.classList.add('locked');
        try { localStorage.removeItem('csRole'); } catch(e) {}
        $('appRoot').style.display = 'none';
        $('loginScreen').classList.remove('hidden');
        pin = ''; updatePinDots();
    });

    (function autoLogin() {
        try {
            var savedRole = localStorage.getItem('csRole');
            if (savedRole === 'admin' || savedRole === 'client') {
                S.role = savedRole;
                $('loginScreen').classList.add('hidden');
                $('appRoot').style.display = 'flex';
                document.body.classList.remove('locked');
                applyRole();
            }
        } catch(e) {}
    })();

    async function init() {
        try {
            await openDB(); await migrate();
            S.dist = await dbAll(SD);
            renderDist(); renderArchive();
        } catch(e) { console.error(e); toast('Erreur de chargement', 'error'); }
    }

    init();
    </script>
</body>
</html>
